<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Blu Movies"><link rel="manifest" href="manifest.webmanifest"><title>Blu Movies</title><style>body{margin:0;background:#10131e;color:#fff;font:16px -apple-system,BlinkMacSystemFont,sans-serif}header{padding:calc(20px + env(safe-area-inset-top)) 20px 18px;background:#171d30}h1{margin:0;color:#62b6ff;font-size:28px}p{color:#b9c4d6;line-height:1.5}.wrap{padding:20px;max-width:700px;margin:auto}input,select,button{box-sizing:border-box;width:100%;padding:15px;border-radius:12px;border:1px solid #44506a;background:#202941;color:white;font-size:16px;margin:8px 0}button{background:#287dd2;border:0;font-weight:700}video{width:100%;background:#000;border-radius:12px;margin-top:12px}.panel{padding:18px;background:#192237;border-radius:16px;margin:18px 0}.small{font-size:13px}nav{display:flex;gap:10px}nav button{flex:1}.hidden{display:none}</style></head><body><header><h1>▶ Blu Movies</h1><p>iPhone edition · prototype</p></header><main class="wrap"><nav><button onclick="tab('movies')">Movies</button><button onclick="tab('tv')">TV Shows</button></nav><section class="panel"><h2 id="heading">Movies</h2><input id="search" placeholder="Search your catalogue" oninput="render()"><div id="results"><p>Catalogue not connected yet.</p></div></section><section class="panel"><h2>Player</h2><p class="small">Play video links you have permission to access. Some third-party hosting pages cannot play in Safari.</p><select id="server"><option>LuluStream</option><option>MixDrop</option><option>VOE</option><option>Other compatible video</option></select><input id="url" type="url" placeholder="Paste an authorized direct video URL"><button onclick="play()">▶ Play</button><p id="message" class="small"></p><video id="player" controls playsinline webkit-playsinline></video></section><p class="small">This prototype does not include Blu Movies' original catalogue or third-party streams.</p></main><script>let kind='movies';function tab(k){kind=k;document.getElementById('heading').textContent=k==='movies'?'Movies':'TV Shows';render()}function render(){document.getElementById('results').innerHTML='<p>Catalogue not connected yet.</p>'}function play(){const u=document.getElementById('url').value.trim();const m=document.getElementById('message');try{const x=new URL(u);if(!['https:','http:'].includes(x.protocol))throw 0;document.getElementById('player').src=x.href;m.textContent='If the link is a webpage instead of a direct video, it may not play.'}catch{m.textContent='Enter a valid video URL.'}}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
